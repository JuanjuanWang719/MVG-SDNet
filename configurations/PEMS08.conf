; PEMS08 调优配置（相对 PEMS08_multi_period.conf）
; 主要改动：更稳的结构预训练、cosine LR、更长 warm/训练、略减弱 L_tr/L_prior
[Data]
graph_signal_matrix_filename = ./data/PEMS08/PEMS08.npz
; PEMS08 边表节点 ID 为 0~169，无需 id_filename
adj_filename = ./data/PEMS08/PEMS08.csv
mvgae_adj_filename = ./data/PEMS08/mvgae_adj.npy
; 调优专用结构文件，避免覆盖基线 z_init
z_init_filename = ./data/PEMS08/z_init_tune.npy
mvgae_checkpoint_filename = ./data/PEMS08/mvgae_pretrain_tune.pt
use_mvgae_adj = False
use_mvgae_pretrain = True
use_node_embed = True
auto_pretrain = True
num_of_vertices = 170
points_per_hour = 12
num_for_predict = 12
; week(12) + day(12) + hour(12) = 36
len_input = 36
dataset_name = PEMS08

[MVGAE]
epochs = 400
lr = 0.0005
latent = 48
num_heads = 4
variational = True
gcn_layers = 2
fusion_dim = 48
patience = 60
kl_weight = 0.5
kl_warmup_epochs = 80
diversity_weight = 0.0
static_feature_dim = 5
seed = 42
hop_order = 2
view_hop_k = 0
view_role_k = 10
view_dir_k = 10
sigma_dir = median
eps_2nd = 1e-8
phy_distance_weight = True
sigma_d = median
corr_threshold = 0.95
corr_top_k = 5
adj_threshold = 0.55
adj_top_k = 8
train_ratio = 0.6
use_edge_mask = True
; 边较少时略降掩码比例
mask_ratio = 0.15
edge_val_ratio = 0.1
edge_test_ratio = 0.1
lambda_neg = 1.0
lambda_mv = 1.0
mv_recon_samples = 2048
latent_top_k = 15
latent_tau = 0.05
pretrain_data_ratio = 1.0

[Hybrid]
local_hidden = 96
global_d_model = 64
global_nhead = 4
global_layers = 2
gwnet_blocks = 4
gwnet_layers = 2
gwnet_nhid = 32
gcn_bool = True
addaptadj = True
gwnet_dropout = 0.3
fusion_dim = 96
dropout = 0.1
period_split = True
fusion_mode = gated
use_local_branch = True
use_global_branch = True
use_abase_prior = True
prior_loss_weight = 0.05
lambda_tr = 0.005
lambda_str = 0.0
use_three_stage = True
warm_epochs = 35
str_lr_scale = 0.08
grad_clip = 5.0
; 双尺度动态空间/home/teacher4/miniconda3/envs/mvgae-hte/bin/python train_hybrid.py  --config configurations/PEMS08_multi_period_tune.conf
use_dual_scale_spatial = True
dyn_top_k = 15
dyn_attn_dim = 32
dyn_state_dim = 96
dyn_sp_layers = 2
d_tod = 16
d_dow = 8
; 结构感知时间建模
use_structure_aware_temporal = True
tem_hidden = 96
tem_gru_layers = 2
tem_n_heads = 8
tem_d_model = 64
joint_finetune_mvgae = False
end_to_end_mvgae = False
transfer_encoder = False
z_lr_scale = 0.08
eval_test_every = 10
patience = 40
log_every = 100

[Training]
ctx = 0
in_channels = 1
nb_block = 2
K = 3
nb_chev_filter = 64
nb_time_filter = 64
batch_size = 32
model_name = hybrid_st_pems08_tune
dataset_name = PEMS08
num_of_weeks = 1
num_of_days = 1
num_of_hours = 1
start_epoch = 0
epochs = 150
learning_rate = 0.001
seed = 42
cudnn_deterministic = False
loss_function = mae
mse_weight = 0.5
huber_beta = 1.0
lr_scheduler = cosine
cosine_eta_min = 1e-6
metric_method = unmask
missing_value = 0.0
